name: Publish Meem Market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meem-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current storefront
        uses: actions/checkout@v4

      - name: Build direct storefront
        shell: bash
        run: |
          mkdir -p dist
          cp index.html 404.html meem-style.css catalog.js meem-app.js meem-logo.svg .nojekyll dist/
          test -s dist/index.html
          test -s dist/meem-app.js
          test -s dist/catalog.js
          grep -q "سوق ميم" dist/index.html
          grep -q "الأقسام الرئيسية" dist/meem-app.js
          echo "Direct storefront artifact prepared"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
