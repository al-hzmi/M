<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f1420"><title>سوق ميم | Meem Market</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#faf9f7;color:#222;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:32px}.mark{width:44px;height:44px;border:3px solid #e8e2df;border-top-color:#8f1420;border-radius:50%;margin:0 auto 18px;animation:s .75s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#777}</style></head><body><div class="box"><div class="mark"></div><strong>جاري تحميل سوق ميم…</strong><p>لحظات فقط.</p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/al-hzmi/M/meem-market-storefront/meem-static';const parts=[];for(let n=1;n<=7;n++){const r=await fetch(`${base}/chunk${n}.b64?v=20260826-1`,{cache:'no-store'});if(!r.ok)throw new Error(`chunk ${n}: ${r.status}`);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('gzip unsupported');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('<title>سوق ميم'))throw new Error('invalid storefront payload');document.open();document.write(html);document.close()}catch(e){console.error('Meem loader error',e);document.body.innerHTML='<div class="box"><strong>تعذر تحميل المتجر</strong><p>حدث خطأ في ملف العرض. أعد تحميل الصفحة.</p></div>'}})();</script></body></html>
