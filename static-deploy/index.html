<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوق ميم | Meem Market</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#faf9f7;color:#222;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:32px}.mark{width:46px;height:46px;border:4px solid #eee;border-top-color:#8f1420;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#666}</style></head><body><div class="box"><div class="mark"></div><strong>جاري تجهيز متجر سوق ميم…</strong><p>لحظات ويظهر المتجر.</p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/al-hzmi/M/meem-market-storefront';const parts=await Promise.all([1,2,3,4].map(async n=>{const r=await fetch(`${base}/production-static.part${n}.b64`,{cache:'no-store'});if(!r.ok)throw new Error('source '+n+' '+r.status);return (await r.text()).trim()}));const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="box"><strong>تعذر تحميل المتجر مؤقتًا</strong><p>أعد تحديث الصفحة بعد لحظات.</p></div>'}})();</script></body></html>
