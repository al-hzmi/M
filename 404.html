ocument.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="load"><strong>تعذر فتح سوق ميم</strong><small>'+String(e.message||e)+'</small><button onclick="location.reload()" style="margin-top:18px;padding:10px 18px;border:0;background:#8f1420;color:white">إعادة المحاولة</button></div>'}})();</script></body></html>
